server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The html file must not be cached, it references the current asset files
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Scripts, styles and fonts of the build, the file names contain a hash
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        etag off;
        if_modified_since off;
        add_header Cache-Control "public, max-age=31536000, no-transform";
    }
}
