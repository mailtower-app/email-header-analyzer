# Security headers for all responses.
#
# nginx does not inherit "add_header" from the server block into a location
# that has an own "add_header". Every location must include this file.

# This will enforce HTTP browsing into HTTPS and avoid ssl stripping attack
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# X-Frame-Options is to prevent from clickJacking attack
add_header X-Frame-Options SAMEORIGIN always;

# disable content-type sniffing on some browsers.
add_header X-Content-Type-Options nosniff always;

# do not tell other websites where the visitor comes from
add_header Referrer-Policy no-referrer always;

# The app works completely in the browser, "connect-src 'none'" guarantees
# that the pasted email headers cannot be sent to any server.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
