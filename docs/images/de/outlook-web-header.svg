<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Outlook im Web, Outlook.com und neues Outlook: Nachrichtendetails anzeigen</title>
  <rect width="880" height="420" rx="14" fill="#f6f8fa"/>
  <g transform="translate(24,24)">
    <rect width="400" height="372" rx="10" fill="#fff" stroke="#d0d7de"/>
    <rect width="400" height="34" rx="10" fill="#eef1f4"/><rect y="24" width="400" height="10" fill="#eef1f4"/>
    <circle cx="18" cy="17" r="5" fill="#ff5f57"/><circle cx="34" cy="17" r="5" fill="#febc2e"/><circle cx="50" cy="17" r="5" fill="#28c840"/>
    <text x="200" y="22" text-anchor="middle" font-size="13" fill="#57606a">Outlook – geöffnete E-Mail</text>
    <text x="20" y="66" font-size="16" font-weight="600" fill="#1f2328">Ihre Rechnung ist da</text>
    <circle cx="36" cy="100" r="14" fill="#c8d6f0"/>
    <text x="58" y="96" font-size="13" font-weight="600" fill="#1f2328">Absender</text>
    <text x="58" y="113" font-size="12" fill="#57606a">An: Sie</text>
    <text x="250" y="104" font-size="17" fill="#57606a">↩</text>
        <text x="290" y="104" font-size="17" fill="#57606a">↪</text>
    <rect x="340" y="84" width="40" height="30" rx="6" fill="#fff4d6" stroke="#d4a017" stroke-width="2"/>
    <text x="360" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">···</text>
    <circle cx="380" cy="80" r="11" fill="#d93025"/><text x="380" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <rect x="20" y="140" width="200" height="10" rx="5" fill="#eaeef2"/>
    <rect x="20" y="160" width="160" height="10" rx="5" fill="#eaeef2"/>
    <rect x="20" y="180" width="190" height="10" rx="5" fill="#eaeef2"/>
    <!-- Menü -->
    <rect x="200" y="124" width="184" height="170" rx="8" fill="#fff" stroke="#d0d7de"/>
    <text x="214" y="150" font-size="13" fill="#57606a">Drucken</text>
    <text x="214" y="176" font-size="13" fill="#57606a">Melden</text>
    <text x="214" y="202" font-size="13" fill="#57606a">Kategorisieren</text>
    <rect x="204" y="214" width="176" height="30" rx="5" fill="#fff4d6" stroke="#d4a017" stroke-width="2"/>
    <text x="214" y="234" font-size="13" font-weight="700" fill="#1f2328">Ansicht</text>
    <text x="360" y="234" font-size="13" fill="#1f2328">›</text>
    <circle cx="380" cy="214" r="11" fill="#d93025"/><text x="380" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="214" y="276" font-size="13" fill="#57606a">Weitere Aktionen…</text>
    <!-- Untermenü -->
    <rect x="120" y="254" width="264" height="104" rx="8" fill="#fff" stroke="#d0d7de"/>
    <text x="134" y="280" font-size="13" fill="#57606a">In Reader-Ansicht anzeigen</text>
    <rect x="124" y="292" width="256" height="30" rx="5" fill="#fff4d6" stroke="#d4a017" stroke-width="2"/>
    <text x="134" y="312" font-size="13" font-weight="700" fill="#1f2328">Nachrichtendetails anzeigen</text>
    <circle cx="380" cy="292" r="11" fill="#d93025"/><text x="380" y="297" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="134" y="344" font-size="13" fill="#57606a">In Vollbild öffnen</text>
  </g>
  <path d="M434 210 h22" stroke="#57606a" stroke-width="3"/><path d="M456 202 l10 8 l-10 8 z" fill="#57606a"/>
  <g transform="translate(476,24)">
    <rect width="380" height="372" rx="10" fill="#fff" stroke="#d0d7de"/>
    <rect width="380" height="34" rx="10" fill="#eef1f4"/><rect y="24" width="380" height="10" fill="#eef1f4"/>
    <text x="190" y="22" text-anchor="middle" font-size="13" fill="#57606a">Fenster: Nachrichtendetails</text>
    <rect x="20" y="50" width="340" height="250" rx="6" fill="#f6f8fa" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
    <g font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#1f2328">
      <text x="32" y="76"><tspan fill="#0550ae">Received:</tspan> from EUR05-…outbound</text>
      <text x="32" y="94">    by AM0PR…prod.outlook.com</text>
      <text x="32" y="116"><tspan fill="#0550ae">Authentication-Results:</tspan> …</text>
      <text x="32" y="138"><tspan fill="#0550ae">Return-Path:</tspan> info@example.com</text>
      <text x="32" y="160"><tspan fill="#0550ae">From:</tspan> Absender &lt;info@…&gt;</text>
      <text x="32" y="182"><tspan fill="#0550ae">Subject:</tspan> Ihre Rechnung ist da</text>
      <text x="32" y="204"><tspan fill="#0550ae">Date:</tspan> Tue, 24 Nov 2026 09:12</text>
      <text x="32" y="226"><tspan fill="#0550ae">X-MS-Exchange-…:</tspan> …</text>
      <text x="32" y="256" fill="#57606a">…</text>
    </g>
    <circle cx="360" cy="50" r="11" fill="#d93025"/><text x="360" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="20" y="328" font-size="13" fill="#1f2328">In den Text klicken, dann</text>
    <rect x="20" y="338" width="62" height="24" rx="4" fill="#fff" stroke="#8c959f"/><text x="51" y="355" text-anchor="middle" font-size="12" font-weight="600">Strg+A</text>
    <text x="90" y="355" font-size="13" fill="#57606a">und</text>
    <rect x="120" y="338" width="62" height="24" rx="4" fill="#fff" stroke="#8c959f"/><text x="151" y="355" text-anchor="middle" font-size="12" font-weight="600">Strg+C</text>
  </g>
</svg>
