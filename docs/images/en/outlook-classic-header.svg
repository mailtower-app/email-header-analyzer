<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Classic Outlook: File, Properties, Internet headers</title>
  <rect width="880" height="420" rx="14" fill="#f6f8fa"/>
  <!-- Fenster 1: Nachricht in eigenem Fenster -->
  <g transform="translate(24,24)">
    <rect width="400" height="372" rx="10" fill="#fff" stroke="#d0d7de"/>
    <rect width="400" height="34" rx="10" fill="#eef1f4"/><rect y="24" width="400" height="10" fill="#eef1f4"/>
    <text x="200" y="22" text-anchor="middle" font-size="13" fill="#57606a">Your invoice is ready – Message</text>
    <!-- Ribbon-Reiter -->
    <rect x="12" y="44" width="58" height="28" rx="5" fill="#fff4d6" stroke="#d4a017" stroke-width="2"/>
    <text x="41" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">File</text>
    <circle cx="70" cy="44" r="11" fill="#d93025"/><text x="70" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="96" y="63" font-size="13" fill="#57606a">Message</text>
    <text x="172" y="63" font-size="13" fill="#57606a">Help</text>
    <line x1="0" y1="80" x2="400" y2="80" stroke="#d0d7de"/>
    <!-- Datei-Backstage -->
    <rect x="0" y="80" width="130" height="292" fill="#1f4e8c"/>
    <text x="16" y="110" font-size="13" fill="#dbe6f5">← Back</text>
    <rect x="8" y="122" width="114" height="30" rx="5" fill="#2f63a8"/>
    <text x="16" y="142" font-size="13" font-weight="600" fill="#fff">Info</text>
    <text x="16" y="176" font-size="13" fill="#dbe6f5">Save As</text>
    <text x="16" y="202" font-size="13" fill="#dbe6f5">Print</text>
    <text x="148" y="112" font-size="18" font-weight="600" fill="#1f2328">Info</text>
    <rect x="148" y="132" width="110" height="96" rx="8" fill="#fff4d6" stroke="#d4a017" stroke-width="2"/>
    <rect x="183" y="146" width="40" height="44" rx="4" fill="#fff" stroke="#57606a" stroke-width="2"/>
    <path d="M191 158 h24 M191 168 h24 M191 178 h16" stroke="#57606a" stroke-width="2"/>
    <text x="203" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Properties</text>
    <circle cx="258" cy="132" r="11" fill="#d93025"/><text x="258" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="148" y="262" font-size="12" fill="#57606a">Tip: first open the email in its</text>
    <text x="148" y="280" font-size="12" fill="#57606a">own window with a <tspan font-weight="700" fill="#1f2328">double-click</tspan>.</text>
    <text x="148" y="298" font-size="12" fill="#57606a"></text>
    <circle cx="160" cy="330" r="11" fill="#d93025"/><text x="160" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="178" y="335" font-size="12" fill="#1f2328">Double-click the email</text>
  </g>
  <path d="M434 210 h22" stroke="#57606a" stroke-width="3"/><path d="M456 202 l10 8 l-10 8 z" fill="#57606a"/>
  <!-- Fenster 2: Properties-Dialog -->
  <g transform="translate(476,24)">
    <rect width="380" height="372" rx="10" fill="#fff" stroke="#d0d7de"/>
    <rect width="380" height="34" rx="10" fill="#eef1f4"/><rect y="24" width="380" height="10" fill="#eef1f4"/>
    <text x="190" y="22" text-anchor="middle" font-size="13" fill="#57606a">Properties</text>
    <text x="20" y="62" font-size="12" fill="#57606a">Importance: Normal      Sensitivity: Normal</text>
    <rect x="20" y="76" width="16" height="16" rx="3" fill="#fff" stroke="#8c959f"/>
    <text x="44" y="89" font-size="12" fill="#57606a">Request a delivery receipt</text>
    <text x="20" y="124" font-size="13" font-weight="700" fill="#1f2328">Internet headers:</text>
    <rect x="20" y="134" width="340" height="170" rx="4" fill="#f6f8fa" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="360" cy="134" r="11" fill="#d93025"/><text x="360" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <g font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#1f2328">
      <text x="30" y="158"><tspan fill="#0550ae">Received:</tspan> from mail.example.com</text>
      <text x="30" y="178"><tspan fill="#0550ae">Authentication-Results:</tspan> …</text>
      <text x="30" y="198"><tspan fill="#0550ae">Return-Path:</tspan> info@example.com</text>
      <text x="30" y="218"><tspan fill="#0550ae">From:</tspan> Sender &lt;info@…&gt;</text>
      <text x="30" y="238"><tspan fill="#0550ae">Subject:</tspan> Your invoice is ready</text>
      <text x="30" y="258"><tspan fill="#0550ae">Date:</tspan> Tue, 24 Nov 2026 09:12</text>
      <text x="30" y="284" fill="#57606a">…</text>
    </g>
    <text x="20" y="330" font-size="13" fill="#1f2328">Click into the field, then</text>
    <rect x="186" y="314" width="62" height="24" rx="4" fill="#fff" stroke="#8c959f"/><text x="217" y="331" text-anchor="middle" font-size="12" font-weight="600">Ctrl+A</text>
    <text x="256" y="331" font-size="13" fill="#57606a">and</text>
    <rect x="288" y="314" width="62" height="24" rx="4" fill="#fff" stroke="#8c959f"/><text x="319" y="331" text-anchor="middle" font-size="12" font-weight="600">Ctrl+C</text>
    <rect x="290" y="346" width="70" height="20" rx="4" fill="#eef1f4" stroke="#8c959f"/><text x="325" y="360" text-anchor="middle" font-size="11">Close</text>
  </g>
</svg>
